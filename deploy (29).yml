name: Mathe-Abenteuer bauen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Emscripten installieren
        shell: bash
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
          source ./emsdk_env.sh
          cd "$GITHUB_WORKSPACE"
          mkdir -p dist
          emcc src/main.cpp -O2 --use-port=sdl2 -sALLOW_MEMORY_GROWTH=1 -o dist/index.html

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Webseite hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Webseite veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
